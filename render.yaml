services:
  - type: web
    name: restaurant-recommendation-api
    runtime: python
    buildCommand: pip install -e . && python scripts/build_index.py
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
